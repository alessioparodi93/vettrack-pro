function exportPDF(dogId){
  const dog=getDog(dogId);if(!dog)return;
  const recs=dogRecs(dogId),shows=dogShows(dogId),trials=dogTrials(dogId);
  let iframe=document.getElementById('_pdf_iframe');
  if(!iframe){iframe=document.createElement('iframe');iframe.id='_pdf_iframe';iframe.style.cssText='position:fixed;width:0;height:0;border:none;left:-9999px;top:-9999px;';document.body.appendChild(iframe);}
  const wnd=iframe.contentWindow;wnd.document.open();
  let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>VetTrack Pro</title><style>
    body{font-family:Arial,sans-serif;max-width:800px;margin:20px auto;font-size:13px;color:#222}
    h1{font-size:22px;color:#7B4F2A;border-bottom:2px solid #7B4F2A;padding-bottom:8px}
    h2{font-size:15px;color:#3A6B48;margin:18px 0 8px;border-bottom:1px solid #ccc;padding-bottom:4px}
    table{width:100%;border-collapse:collapse;margin-bottom:12px}
    th{background:#f5f0ea;padding:6px 8px;text-align:left;font-size:11px;color:#7B4F2A;text-transform:uppercase}
    td{padding:6px 8px;border-bottom:1px solid #eee;font-size:12px}
    .chip{display:inline-block;background:#EDE7DF;padding:2px 8px;border-radius:10px;font-size:11px;margin:2px}
    @media print{body{margin:0}}
  </style>
</head><body>
  <h1>🐾 ${dog.emoji||''} ${esc(dog.name)}</h1>
  <table><tr><th colspan="4">Anagrafica</th></tr>
    <tr><td><strong>Razza</strong></td><td>${dog.breed||'—'}</td><td><strong>Sesso</strong></td><td>${dog.gender||'—'}</td></tr>
    <tr><td><strong>Data nascita</strong></td><td>${fd(dog.birthDate)}</td><td><strong>Microchip</strong></td><td>${dog.microchip||'—'}</td></tr>
    <tr><td><strong>LOI/ENCI</strong></td><td>${dog.loi||'—'}</td><td><strong>Affisso</strong></td><td>${dog.affisso||'—'}</td></tr>
    <tr><td><strong>Colore</strong></td><td>${dog.color||'—'}</td><td><strong>Intestatario</strong></td><td>${esc(dog.intestatario)||'—'}</td></tr>
    ${dog.notes?`<tr><td><strong>Note</strong></td><td colspan="3">${esc(dog.notes)}</td></tr>`:''}
  </table>`;
  // PESO
  const weights=(dog.weights||[]).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(weights.length){
    html+=`<h2>Storico Peso</h2><table><tr><th>Data</th><th>Peso</th><th>Variazione</th></tr>`;
    weights.forEach((w,i)=>{
      const prev=weights[i+1];
      const diff=prev?((w.kg-prev.kg)>=0?'+':'')+((w.kg-prev.kg).toFixed(2))+' kg':'—';
      const col=prev?(w.kg>=prev.kg?'#2E7048':'#B03030'):'#333';
      html+=`<tr><td>${fd(w.date)}</td><td><strong>${w.kg} kg</strong>${i===0?' <em style="color:#7B4F2A">(ultima)</em>':''}</td><td style="color:${col}">${diff}</td></tr>`;
    });
    html+=`</table>`;
  }
  if(recs.length){
    const recsActive=recs.filter(r=>!isSuperseded(r)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const recsStorico=recs.filter(r=>isSuperseded(r)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    html+=`<h2>Storia Clinica — Trattamenti Attivi</h2><table><tr><th>Data</th><th>Trattamento</th><th>Tipo</th><th>Prossima scadenza</th></tr>`;
    recsActive.forEach(r=>{html+=`<tr><td>${fd(r.date)}</td><td>${esc(r.name)}</td><td>${REC_CATS[r.category]?.l||r.category}</td><td>${fd(r.dueDate)||'—'}</td></tr>`;});
    html+=`</table>`;
  }
  if(shows.length){html+=`<h2>Esposizioni di Bellezza</h2><table><tr><th>Data</th><th>Luogo</th><th>Classe</th><th>Qualifica</th><th>Certificati</th></tr>`;
    shows.forEach(s=>{html+=`<tr><td>${fd(s.date)}</td><td>${esc(s.location)||'—'}</td><td>${s.classe||'—'}</td><td>${s.qual||'—'}${s.placement?' ('+s.placement+'°)':''}</td><td>${s.certs?.join(', ')||'—'}</td></tr>`;});html+=`</table>`;}
  if(trials.length){html+=`<h2>Prove di Lavoro</h2><table><tr><th>Data</th><th>Luogo</th><th>Tipo prova</th><th>Qualifica</th><th>Certificati</th></tr>`;
    trials.forEach(t=>{const tt=TRIAL_TYPES.find(x=>x.id===t.type);html+=`<tr><td>${fd(t.date)}</td><td>${esc(t.location)||'—'}</td><td>${tt?.label||t.type}${t.classe?' — '+t.classe:''}</td><td>${t.qual||'—'}${t.placement?' ('+t.placement+'°)':''}</td><td>${t.certs?.join(', ')||'—'}${t.speciale?' (Prova Speciale)':''}</td></tr>`;});html+=`</table>`;}
  html+=`<p style="margin-top:20px;font-size:10px;color:#999">Generato da VetTrack Pro il ${fd(tod())}</p>
  </body></html>`;
  wnd.document.write(html);wnd.document.close();
  setTimeout(()=>{try{wnd.print();}catch(e){toast('Apri il PDF dal menu di stampa');}},400);
}


async function addProgesterone(heatId){
  if(!heatId){toast('Salva prima il calore');return;}
  const date=document.getElementById('prog-date')?.value;
  const val=document.getElementById('prog-val')?.value;
  if(!date||!val){toast('Inserisci data e valore');return;}
  const heat=S.heats.find(h=>h.id===heatId);if(!heat)return;
  if(!heat.progesterone)heat.progesterone=[];
  heat.progesterone.push({date,val:parseFloat(val)});
  heat.progesterone.sort((a,b)=>a.date.localeCompare(b.date));
  S.heats=S.heats.map(h=>h.id===heatId?heat:h);
  await sv.h(heat);
  if(parseFloat(val)>=5)toast('🐾 Valore ottimale raggiunto! Prepara l\'accoppiamento!');
  else if(parseFloat(val)>=2.5)toast('⏰ Progesterone in salita — tieni d\'occhio!');
  else toast('Misura salvata');
  S.editHeatId=heatId;
  renderHeatForm();
}

async function removeProgesterone(idx,heatId){
  if(!heatId)return;
  const heat=S.heats.find(h=>h.id===heatId);if(!heat)return;
  heat.progesterone=(heat.progesterone||[]).filter((_,i)=>i!==idx);
  S.heats=S.heats.map(h=>h.id===heatId?heat:h);
  await sv.h(heat);
  S.editHeatId=heatId;
  renderHeatForm();
}


function renderCalendarWidget(){
  const now=new Date();
  const yr=now.getFullYear(),mo=now.getMonth();
  const monthNames=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const firstDay=new Date(yr,mo,1).getDay();
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const start=(firstDay+6)%7; // Monday first

  // Collect events for the month
  const events={};
  const addEv=(dateStr,type,label)=>{
    if(!dateStr)return;
    const d=new Date(dateStr);
    if(d.getFullYear()===yr&&d.getMonth()===mo){
      const day=d.getDate();
      if(!events[day])events[day]=[];
      events[day].push({type,label});
    }
  };

  // Scadenze trattamenti
  S.records.filter(r=>r.dueDate&&!isSuperseded(r)).forEach(r=>{
    const dog=getDog(r.dogId);
    if(dog&&(dog.stato||'attivo')==='attivo')
      addEv(r.dueDate,'red',dog.name+': '+esc(r.name));
  });
  // Parti previsti
  S.litters.forEach(l=>{addEv(l.birthDate,'green','Parto: '+(getDog(l.motherId)?.name||'?'));});
  // Accoppiamenti
  S.heats.forEach(h=>{if(h.matingDate)addEv(h.matingDate,'pink','Accopp.: '+(getDog(h.dogId)?.name||'?'));});
  // Esposizioni
  S.shows.forEach(s=>{addEv(s.date,'blue','Expo: '+(getDog(s.dogId)?.name||'?')+' - '+(s.location||''));});
  // Prove
  S.trials.forEach(t=>{addEv(t.date,'blue','Prova: '+(getDog(t.dogId)?.name||'?'));});

  const typeColor={red:'#B03030',green:'#2E7048',pink:'#8B3A6A',blue:'#2A5F8B'};
  const typeEmoji={red:'💉',green:'🐣',pink:'🌸',blue:'🏅'};

  let cal=`<div class="card" style="margin-bottom:12px;padding:12px">
    <div style="text-align:center;font-weight:700;font-size:15px;color:var(--pr);margin-bottom:10px">${monthNames[mo]} ${yr}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-bottom:4px">
      ${['L','M','M','G','V','S','D'].map(d=>`<div style="font-size:10px;font-weight:700;color:var(--t3);padding:2px">${d}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">`;

  // Empty cells before first day
  for(let i=0;i<start;i++) cal+=`<div></div>`;

  for(let d=1;d<=daysInMonth;d++){
    const isToday=d===now.getDate();
    const dayEvents=events[d]||[];
    const dots=dayEvents.slice(0,3).map(e=>`<div style="width:5px;height:5px;border-radius:50%;background:${typeColor[e.type]||'#888'};margin:0 auto"></div>`).join('');
    const title=dayEvents.map(e=>typeEmoji[e.type]+' '+e.label).join('\n');
    cal+=`<div style="padding:3px 1px;border-radius:4px;background:${isToday?'var(--pr)':'transparent'};cursor:${dayEvents.length?'help':'default'}" title="${title}">
      <div style="font-size:11px;font-weight:${isToday?'700':'400'};color:${isToday?'#fff':'var(--tx)'}">${d}</div>
      <div style="display:flex;justify-content:center;gap:1px;min-height:6px">${dots}</div>
    </div>`;
  }

  cal+=`</div>
    <div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap">
      ${Object.entries(typeColor).map(([t,c])=>`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--t2)"><div style="width:8px;height:8px;border-radius:50%;background:${c}"></div>${typeEmoji[t]} ${t==='red'?'Scadenze':t==='green'?'Parti':t==='pink'?'Calori':'Gare/Expo'}</div>`).join('')}
    </div>
  </div>`;
  return cal;
}

async function sendEmail(){
  const btn=document.getElementById('send-btn');if(!btn)return;
  const up=upcoming(S.cfg?.daysAhead||365);
  if(!up.length){toast('Nessuna scadenza!');return;}
  if(!S.cfg.email){toast('Imposta la tua email nelle impostazioni');return;}
  btn.innerHTML='<span class="sp"></span> Invio...';btn.disabled=true;
  const NL='\n';
  const lista=up.map(r=>{const s=r._d<0?('SCADUTO '+Math.abs(r._d)+'gg fa'):('tra '+r._d+' giorni');return '- '+(r._dog?r._dog.name:'?')+': '+r.name+' ('+(REC_CATS[r.category]?.l||r.category)+') - '+fd(r.dueDate)+' - '+s;}).join(NL);
  const cani=S.dogs.map(d=>'- '+d.name+' ('+(d.breed||'')+', '+(d.gender||'')+')').join(NL);
  const subject='VetTrack Pro - Promemoria scadenze veterinarie';
  const body='Ciao '+(currentUser?.displayName?.split(' ')[0]||'')+','+NL+NL+'Scadenze nei prossimi '+S.cfg.daysAhead+' giorni:'+NL+NL+lista+NL+NL+'Cani:'+NL+cani+NL+NL+'VetTrack Pro - '+(S.cfg?.nomeAllevamento||'VetTrack Pro');
  const ok=await sendEmailViaEmailJS(S.cfg.email,subject,body);
  if(ok){await fbSetLastEmail();toast('Email inviata!');}
  else{toast('Errore invio email');}
  btn.innerHTML='Invia promemoria email';
  btn.disabled=false;
}
async function autoCheck(){
  if(!S.cfg.email)return;
  try{const lastDate=await fbGetLastEmail();if(lastDate===tod())return;}catch{}
  const up=upcoming(S.cfg?.daysAhead||365);if(!up.length)return;
  const urgent=up.filter(r=>r._d<=7);if(!urgent.length)return;
  setTimeout(()=>sendEmail(),3000);
}

function downloadVaccineCalendar(name,dueDate,dogName){
  if(!dueDate)return;
  const title=encodeURIComponent('💉 '+dogName+': '+name);
  const desc=encodeURIComponent('Promemoria vaccino per '+dogName+'. Scadenza: '+fd(dueDate)+'. '+(S.cfg?.nomeAllevamento||'VetTrack Pro'));
  // Fix 1: data inizio e inizio+1 giorno (formato All-Day Google Calendar)
  const d1=dueDate.replace(/-/g,'');
  const nextDay=new Date(dueDate);
  nextDay.setDate(nextDay.getDate()+1);
  const d2=nextDay.toISOString().slice(0,10).replace(/-/g,'');
  // Fix 2: rimosso &allday=true (non supportato da Google)
  const url='https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+title
    +'&dates='+d1+'/'+d2
    +'&details='+desc;
  window.open(url,'_blank');
}
